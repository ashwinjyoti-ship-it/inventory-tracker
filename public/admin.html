<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCPA Sound Inventory · Admin</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login" class="login-card" hidden>
    <h1>Admin sign-in</h1>
    <div class="field">
      <label for="login-pw">Password</label>
      <input type="password" id="login-pw" autocomplete="current-password" />
    </div>
    <button id="login-btn">Sign in</button>
    <div id="login-err" class="small" style="color: var(--bad); margin-top: 10px;"></div>
  </div>

  <div id="app" class="admin" hidden>
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <h1 style="margin:0;">NCPA Sound Inventory · Admin</h1>
      <div class="row">
        <a href="/" class="tag">Open mobile UI</a>
        <button id="change-password" class="secondary">Change password</button>
        <button id="logout" class="secondary">Sign out</button>
      </div>
    </div>

    <nav class="tabs">
      <button data-view="equipment" class="active">Equipment</button>
      <button data-view="movements">Movements</button>
      <button data-view="venues">Venues</button>
      <button data-view="crew">Crew</button>
    </nav>

    <section id="view-equipment" class="view">
      <div class="toolbar">
        <div class="field"><label>Search</label><input type="search" id="eq-search" placeholder="Name or label…" /></div>
        <div class="field"><label>Category</label><select id="eq-category"><option value="">All</option></select></div>
        <div class="field"><label>Currently at</label><select id="eq-venue"><option value="">Any</option></select></div>
        <div class="field"><label>Status</label>
          <select id="eq-status">
            <option value="">All</option>
            <option value="at_home">At home venue</option>
            <option value="away_from_home">Away from home</option>
            <option value="in_transit">In transit (with crew)</option>
          </select>
        </div>
        <button id="eq-refresh" class="secondary">Refresh</button>
      </div>
      <div id="eq-summary" class="small muted" style="margin-bottom:8px;"></div>
      <div style="overflow:auto; max-height: 70vh;">
        <table id="eq-table">
          <thead><tr>
            <th>Item</th><th>Category</th><th>Home</th><th>Currently at</th><th>Held by</th><th>Heading to</th><th>Last movement</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="view-movements" class="view" hidden>
      <div class="toolbar">
        <div class="field"><label>Crew</label><select id="mv-crew"><option value="">All</option></select></div>
        <div class="field"><label>Venue</label><select id="mv-venue"><option value="">All</option></select></div>
        <div class="field"><label>Limit</label><select id="mv-limit"><option>50</option><option selected>200</option><option>500</option></select></div>
        <button id="mv-refresh" class="secondary">Refresh</button>
      </div>
      <div style="overflow:auto; max-height: 70vh;">
        <table id="mv-table">
          <thead><tr>
            <th>When</th><th>Action</th><th>Item</th><th>From</th><th>To</th><th>Crew</th><th>Notes</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="view-venues" class="view" hidden>
      <div class="panel">
        <h2>Add venue</h2>
        <div class="row">
          <input type="text" id="v-name" placeholder="Venue name" />
          <input type="text" id="v-code" placeholder="Code (e.g. OUTDOOR1)" style="max-width:180px;" />
          <label class="row" style="margin:0; gap:6px;">
            <input type="checkbox" id="v-outdoor" /> Outdoor
          </label>
          <button id="v-add">Add</button>
        </div>
      </div>
      <div style="overflow:auto;">
        <table id="v-table">
          <thead><tr><th>Name</th><th>Code</th><th>Outdoor</th><th>Active</th><th>Items (home / current)</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="view-crew" class="view" hidden>
      <div class="panel">
        <h2>Add crew member</h2>
        <div class="row">
          <input type="text" id="c-name" placeholder="Crew name" />
          <select id="c-role" style="max-width:160px;">
            <option value="member">Member</option>
            <option value="head">Head</option>
          </select>
          <button id="c-add">Add</button>
        </div>
      </div>
      <div style="overflow:auto;">
        <table id="c-table">
          <thead><tr><th>Name</th><th>Role</th><th>Active</th><th>Currently holding</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>

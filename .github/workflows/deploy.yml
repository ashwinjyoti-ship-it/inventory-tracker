name: Seed Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # Monthly reminder to update if needed

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate initial data SQL
        run: npm run migrate

      - name: Seed D1 database
        run: npx wrangler d1 execute sound-inventory --file database/migrations/001_initial_data.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

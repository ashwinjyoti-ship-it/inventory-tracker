name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/sound-inventory-tracker-Ipn8S
    paths-ignore:
      - "README.md"
      - "Context.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      reseed:
        description: "Wipe & re-seed D1 from db/seed.sql (DANGEROUS — clears all movements)"
        required: false
        default: "false"
      reset_admin_password:
        description: "Reset admin password to repo default (Lsi@123456 unless build_seed override)"
        required: false
        default: "false"

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
  PROJECT_NAME: ls-inventory
  DB_NAME: sound-inventory

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler@3

      # ---- 1. Render wrangler.toml with the real D1 database ID ----
      - name: Inject D1 database ID into wrangler.toml
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is empty"; exit 1
          fi
          sed -i "s|PLACEHOLDER_D1_ID|$CLOUDFLARE_D1_DATABASE_ID|" wrangler.toml
          grep -A1 d1_databases wrangler.toml

      # ---- 2. Apply schema (idempotent) ----
      - name: Apply D1 schema
        run: wrangler d1 execute "$DB_NAME" --remote --file=db/schema.sql

      # ---- 3. Optional: wipe data (re-seed) ----
      - name: Wipe data (movements, items) for re-seed
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reseed == 'true' }}
        run: |
          wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM movements;"
          wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM items;"
          wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM equipment_models;"
          wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM venues;"
          wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM crew;"
          if [ "${{ github.event.inputs.reset_admin_password }}" = "true" ]; then
            wrangler d1 execute "$DB_NAME" --remote --command "DELETE FROM settings;"
          fi

      # ---- 4. Seed if items table is empty ----
      - name: Check if seed needed
        id: seed_check
        run: |
          set -euo pipefail
          OUT=$(wrangler d1 execute "$DB_NAME" --remote --json --command "SELECT COUNT(*) AS c FROM items;")
          echo "$OUT" | head -c 800
          COUNT=$(echo "$OUT" | jq -r '.[0].results[0].c // 0')
          echo "Items currently in DB: $COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed D1 (initial data)
        if: ${{ steps.seed_check.outputs.needed == 'true' }}
        run: wrangler d1 execute "$DB_NAME" --remote --file=db/seed.sql

      # ---- 5. Deploy Pages ----
      # Create project if it doesn't already exist; || true ignores "already exists" error.
      # Project name == subdomain → always inventory-tracker.pages.dev
      - name: Create Pages project if needed
        run: wrangler pages project create "$PROJECT_NAME" --production-branch=main 2>&1 || true

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy public \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Print live URL
        run: |
          echo "::notice::Mobile UI:  https://$PROJECT_NAME.pages.dev"
          echo "::notice::Admin UI:   https://$PROJECT_NAME.pages.dev/admin"

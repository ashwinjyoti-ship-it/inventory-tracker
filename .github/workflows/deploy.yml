name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "context.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
  PROJECT_NAME: ls-inventory
  DB_NAME: sound-inventory

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler@3

      # ---- 1. Render wrangler.toml with the real D1 database ID ----
      - name: Inject D1 database ID into wrangler.toml
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is empty"; exit 1
          fi
          sed -i "s|PLACEHOLDER_D1_ID|$CLOUDFLARE_D1_DATABASE_ID|" wrangler.toml
          grep -A1 d1_databases wrangler.toml

      # ---- 2. Apply schema (idempotent) ----
      - name: Apply D1 schema
        run: wrangler d1 execute "$DB_NAME" --remote --file=database/schema.sql

      # ---- 3. Deploy Pages ----
      - name: Create Pages project if needed
        run: wrangler pages project create "$PROJECT_NAME" --production-branch=main 2>&1 || true

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy src/frontend \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Print live URL
        run: |
          echo "::notice::Mobile UI:  https://$PROJECT_NAME.pages.dev"
          echo "::notice::Admin UI:   https://$PROJECT_NAME.pages.dev/admin"

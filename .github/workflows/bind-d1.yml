name: Bind D1 to Pages

on:
  workflow_dispatch:

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get D1 database ID
        id: get_db
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "sound-inventory") | .uuid')
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          echo "Found database ID: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind D1 database to Pages project
        run: |
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/sound-inventory-tracker" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"d1_databases\": {
                    \"DB\": { \"id\": \"$DB_ID\" }
                  },
                  \"env_vars\": {
                    \"ADMIN_PASSWORD\": { \"value\": \"changeme\" },
                    \"ENVIRONMENT\": { \"value\": \"production\" }
                  }
                },
                \"preview\": {
                  \"d1_databases\": {
                    \"DB\": { \"id\": \"$DB_ID\" }
                  }
                }
              }
            }" | jq '.success, .errors'

      - name: Trigger Pages redeploy
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/sound-inventory-tracker/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq '.success, .errors'

      - name: Done
        run: echo "✅ D1 database bound to Pages! App will redeploy automatically."
